version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install --frozen-lockfile

            - echo "SANITY_STUDIO_PROJECT_ID=$SANITY_STUDIO_PROJECT_ID" >> apps/studio/.env.local
            - echo "SANITY_STUDIO_APP_ID=$SANITY_STUDIO_APP_ID" >> apps/studio/.env.local
            - echo "SANITY_STUDIO_DATASET=$SANITY_STUDIO_DATASET" >> apps/studio/.env.local
            - echo "SANITY_AUTH_TOKEN=$SANITY_AUTH_TOKEN" >> apps/studio/.env.local
            - echo "SANITY_STUDIO_FRONTEND_SITE_URL=$SANITY_STUDIO_FRONTEND_SITE_URL" >> apps/studio/.env.local

            - echo "NEXT_PUBLIC_SANITY_PROJECT_ID=$NEXT_PUBLIC_SANITY_PROJECT_ID" >> apps/website/.env
            - echo "NEXT_PUBLIC_SANITY_APP_ID=$NEXT_PUBLIC_SANITY_APP_ID" >> apps/website/.env
            - echo "NEXT_PUBLIC_SANITY_DATASET=$NEXT_PUBLIC_SANITY_DATASET" >> apps/website/.env
            - echo "NEXT_PUBLIC_SANITY_API_VERSION=$NEXT_PUBLIC_SANITY_API_VERSION" >> apps/website/.env
            - echo "NEXT_PUBLIC_SANITY_STUDIO_URL=$NEXT_PUBLIC_SANITY_STUDIO_URL" >> apps/website/.env
            - echo "NEXT_PUBLIC_REVALIDATE=$NEXT_PUBLIC_REVALIDATE" >> apps/website/.env
            - echo "SANITY_API_READ_TOKEN=$SANITY_API_READ_TOKEN" >> apps/website/.env
        build:
          commands:
            - rm -rf apps/website/.next
            - pnpm run deploy:amplify
      artifacts:
        baseDirectory: apps/website/.next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
      buildPath: /
    appRoot: apps/website
